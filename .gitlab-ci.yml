stages:
  - docker

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "true"
  Version: "1.0.${CI_PIPELINE_IID}"

docker-image:
  stage: docker
  tags:
    - self-hosted   # match your runner tag
  rules:
    # push to master
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

    # release (tag)
    - if: '$CI_COMMIT_TAG'
      when: on_success

    # manual trigger
    - when: manual

  script:
    - echo "Building Docker image for GoldEx Landing with version $Version"

    - |
      docker build --push \
        -t localhost:5000/goldex-landing:latest \
        -t localhost:5000/goldex-landing:$Version \
        -f Dockerfile \
        .

    - echo "Docker image for GoldEx Landing with version $Version built and pushed successfully"

    - echo "Running initialization script on server"
    - sudo chmod +x /masoud/goldex-landing/initialize.sh
    - sudo /masoud/goldex-landing/initialize.sh
