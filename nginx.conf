server {
    listen 8080 default_server;
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # CSS and JS: Force revalidation on every load (ETag/304 check), never stale
    location ~* \.(?:css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Media, images and fonts can be cached long-term
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
    }

    location ~* \.(?:manifest|webmanifest|xml|json)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # HTML files: Never cache on disk, always fetch latest HTML document
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
