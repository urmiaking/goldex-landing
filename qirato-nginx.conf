# ==============================================================================
# Nginx Reverse Proxy Configuration for Qirato (قیراط)
# Domain: qirato.ir, www.qirato.ir -> http://qirato:8080
# ==============================================================================

# Upstream definition for container service
upstream qirato_backend {
    server qirato:8080;
    keepalive 32;
}

# HTTP Server Block (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name qirato.ir www.qirato.ir;

    # Logging
    access_log /var/log/nginx/qirato_access.log;
    error_log /var/log/nginx/qirato_error.log warn;

    # Max upload / request limits
    client_max_body_size 20M;

    # Proxy to Qirato Container on port 8080
    location / {
        proxy_pass http://qirato_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Certbot ACME challenge location for SSL issuance
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

