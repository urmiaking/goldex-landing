# ==============================================================================
# Nginx Server Block for Qirato (قیراط)
# Add this block inside the `http { ... }` block of your existing nginx.conf
# ==============================================================================

server {
    listen 80;
    server_name qirato.ir www.qirato.ir;
    client_max_body_size 50M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_qirato http://qirato:8080;
        proxy_pass $upstream_qirato;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # مسیر تایید صدور گواهینامه SSL با Certbot (در صورت نیاز)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

